services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-campusverify}
      POSTGRES_USER: ${POSTGRES_USER:-campusverify}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-campusverify} -d ${POSTGRES_DB:-campusverify}"]
      interval: 5s
      timeout: 5s
      retries: 15
  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://campusverify:local-dev-only@db:5432/campusverify}
      UPLOAD_DIR: /app/private_uploads
    volumes:
      - private_uploads:/app/private_uploads
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./frontend
    environment:
      VITE_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
volumes:
  pgdata:
  private_uploads:
